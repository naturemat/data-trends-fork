#Ejemplo de reverse proxy para poner delante de la aplicacion.
#
# Motivo: hoy gunicorn escucha en 0.0.0.0:5000, o sea que la aplicacion
# responde directamente desde Internet, sin TLS y sin limite de peticiones.
# Ademas POST /api/ai_summary es un proxy a Groq sin autenticacion, con lo
# cual cualquiera que llegue al puerto puede gastar la cuota.
#
# Puesta en marcha:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/scraper
#   sudo ln -s /etc/nginx/sites-available/scraper /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Al activarlo hay que cambiar el bind de gunicorn.conf.py a 127.0.0.1:5000
# para que el puerto 5000 deje de quedar exposed.

server {
    listen 80;
    server_name _;

    # Los trends no llegan por POST, pero el filtro de fechas usa query string.
    client_max_body_size 1m;

    # El dashboard carga Tailwind, Chart.js, lucide y wordcloud2 desde CDN.
    # Si en produccion se necesita salir a internet para el front, hay que
    # permitir explicitamente esos origenes en lugar de dejarlos abiertos.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/ai_summary y /api/metrics/ai_classification pueden tardar mas
        # de un minuto contra Groq; sin esto nginx cortaria con 504.
        proxy_read_timeout 180s;
    }

    # Cachear el shell del dashboard por poco tiempo, no las metricas.
    location = / {
        add_header Cache-Control "no-cache";
    }
}
