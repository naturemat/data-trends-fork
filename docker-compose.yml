version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: postgres_prod
    restart: always
    environment:
      POSTGRES_USER: Grupo1 #TU_USER
      POSTGRES_PASSWORD: passGrupo1 #TU_PASSWORD
      POSTGRES_DB: scraper_db #TU_DB
    ports:
      - "6543:5432"
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d
    